<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACL Platform</title>
<style>
:root{--bg:#0b1020;--panel:#111827;--soft:#1f2937;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--accent:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#05070d);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto}
a{color:#93c5fd;text-decoration:none}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:rgba(15,23,42,.65);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:18px;margin-bottom:6px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:10px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer}.nav button.active{background:#0f172a;border-color:var(--line)}
.main{padding:18px;overflow:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.pill{padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:rgba(17,24,39,.85);border:1px solid var(--line);border-radius:12px;padding:12px}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
@media (max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.span-4,.span-6,.span-8,.span-12{grid-column:span 12}}
.h{font-size:13px;font-weight:700;margin-bottom:8px}.muted{color:var(--muted)} .tiny{font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;background:#0a0f1c;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:320px;overflow:auto;color:#cbd5e1}
input,select,textarea{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px} textarea{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#1f2937;color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:8px;cursor:pointer}.btn.primary{background:#14532d;border-color:#166534}.btn.warn{background:#451a03;border-color:#78350f}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid #1f2937;text-align:left;font-size:12px;vertical-align:top}.status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}.status.success{background:#052e16;color:#86efac}.status.failed{background:#3a0f14;color:#fecaca}.status.needs_human{background:#3b2f06;color:#fde68a}.status.pending{background:#111827;color:#cbd5e1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px}.kv .k{color:var(--muted)} .list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0f172a}
.hidden{display:none !important}.eventlog{max-height:220px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#090d18;border:1px solid var(--line);padding:8px;border-radius:10px}.eventline{padding:2px 0;border-bottom:1px dashed #1f2937}
.codebox{max-height:260px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:1000px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">ACL Platform</div>
    <div class="sub">Self-hosted control plane for safe AI actions</div>
    <div class="nav" id="nav"></div>
    <div class="tiny" style="margin-top:12px">This UI runs on <code>acl serve</code>. ACL runtime remains the executor; receipts are the source of truth.</div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="pill">Single-tenant self-hosted</div>
      <div class="pill">Hybrid forms + ACL code</div>
      <div class="pill">Streaming events (SSE)</div>
      <div style="margin-left:auto" class="tiny"><a href="/quickstart">Quickstart</a> · <a href="/agenticflow">AgenticFlow</a> · <a href="/playground">Playground</a></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
const state = { page: 'overview', overview:null, runs:[], runDetail:null, packs:[], manifests:[], templates:[], approvals:[], creds:[], selectedPack:'', selectedTemplate:'', lastRun:null, events:[] };
const pages = [
  ['overview','Overview'],['templates','Templates / Flows'],['integrations','Integrations / Packs'],['manifests','Manifests'],['runs','Runs & Receipts'],['approvals','Approvals'],['credentials','Credentials']
];
let es = null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtMs(n){ if(n==null) return '-'; return n+'ms'; }
function setPage(p){ state.page=p; renderNav(); render(); if(p==='runs') loadRuns(); if(p==='overview') loadOverview(); if(p==='approvals') loadApprovals(); if(p==='credentials') loadCreds(); if(p==='manifests') loadManifests(); if(p==='integrations') loadPacks(); if(p==='templates') loadTemplates(); }
function renderNav(){ const n=document.getElementById('nav'); n.innerHTML = pages.map(([id,label])=>`<button class="${state.page===id?'active':''}" onclick="setPage('${id}')">${label}</button>`).join(''); }
function getPlatformToken(){ return localStorage.getItem('acl_platform_token') || ''; }
function maybeAuthHeaders(h){ const token = getPlatformToken(); if(token){ h['Authorization'] = 'Bearer ' + token; } return h; }
async function api(path, opts={}){ const baseHeaders = maybeAuthHeaders({'Content-Type':'application/json'}); const merged = Object.assign({headers:baseHeaders}, opts); if(opts.headers){ merged.headers = maybeAuthHeaders(Object.assign({}, opts.headers)); } const r = await fetch(path, merged); const ct = r.headers.get('content-type')||''; const data = ct.includes('application/json') ? await r.json() : await r.text(); if(r.status===401){ throw new Error('Unauthorized. Set ACL_SERVE_API_KEY token via window.setACLToken(\"...\") in console (MVP auth helper).'); } if(!r.ok) throw new Error(data.error||data||r.statusText); return data; }
function statusPill(s){ s=String(s||'unknown'); return `<span class="status ${esc(s)}">${esc(s)}</span>` }
function pushEvent(evt){ state.events.unshift(evt); state.events = state.events.slice(0,150); if(state.page==='overview' || state.page==='runs') render(); }
function connectStream(){ if(es) es.close(); const tok = getPlatformToken(); const url = tok ? ('/api/platform/runs/stream?token='+encodeURIComponent(tok)) : '/api/platform/runs/stream'; es = new EventSource(url); es.onmessage = (e)=>{ try{ const msg=JSON.parse(e.data); pushEvent(msg);}catch{} }; es.onerror = ()=>{}; }
async function loadOverview(){ state.overview = await api('/api/platform/overview'); render(); }
async function loadRuns(){ state.runs = await api('/api/platform/runs?limit=25'); render(); }
async function loadRun(id){ state.runDetail = await api('/api/platform/runs/'+id); render(); }
async function loadPacks(){ state.packs = await api('/api/platform/packs'); render(); }
async function loadManifests(){ state.manifests = await api('/api/platform/manifests'); render(); }
async function loadTemplates(){ state.templates = await api('/api/platform/templates'); if(!state.selectedPack && state.templates.length){ state.selectedPack=state.templates[0].pack; state.selectedTemplate=state.templates[0].id; } render(); }
async function loadApprovals(){ state.approvals = await api('/api/platform/approvals'); render(); }
async function loadCreds(){ state.creds = await api('/api/platform/credentials'); render(); }
function overviewView(){ const o=state.overview||{}; const cards = [
  ['Recent Runs', o.runs_count ?? 0, 'Stored receipts in local history'],
  ['Pending Approvals', o.pending_approvals ?? 0, 'Preview/confirm requests waiting'],
  ['Built-in Packs', o.builtin_packs ?? 0, 'Installable integration/template packs'],
  ['Credentials', o.credentials ?? 0, 'BYO tokens stored in ACL Platform']
 ];
 return `<div class="grid">
  ${cards.map(c=>`<div class="card span-3"><div class="tiny">${esc(c[0])}</div><div style="font-size:28px;font-weight:800">${esc(c[1])}</div><div class="tiny">${esc(c[2])}</div></div>`).join('')}
  <div class="card span-8"><div class="h">Live Event Stream</div><div class="eventlog">${(state.events||[]).map(ev=>`<div class="eventline">${esc(ev.type)} · ${esc(ev.run_id||ev.platform_run_id||'')} ${ev.data&&ev.data.step?('· '+esc(ev.data.step)) : ''}</div>`).join('') || '<span class="muted">No events yet. Run a template to see streaming events.</span>'}</div></div>
  <div class="card span-4"><div class="h">How Teams Use This</div><div class="list"><div class="item"><strong>App platform teams</strong><div class="tiny">Expose safe agent access to app APIs via packs, manifests, and preview/confirm flows.</div></div><div class="item"><strong>Enterprise IT</strong><div class="tiny">Govern agent automations with receipts, approvals, and centralized credentials.</div></div></div></div>
  <div class="card span-12"><div class="h">Start Here</div><div class="btns"><button class="btn" onclick="setPage('integrations')">Install a Pack</button><button class="btn primary" onclick="setPage('templates')">Run a Template</button><button class="btn" onclick="setPage('runs')">Inspect Receipts</button></div></div>
 </div>`; }
function integrationsView(){ const packs = state.packs||[]; return `<div class="grid"><div class="card span-12"><div class="h">Packs</div><table class="tbl"><thead><tr><th>Name</th><th>Version</th><th>Templates</th><th>Description</th><th></th></tr></thead><tbody>${packs.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.version||'-')}</td><td>${esc((p.templates||[]).length)}</td><td>${esc(p.description||'')}</td><td><button class="btn" onclick="installPack('${esc(p.name)}')">Install</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No packs</td></tr>'}</tbody></table><div class="tiny">Built-in packs are embedded in the ACL binary. Use <code>acl pack init</code> and <code>acl adapter-gen openapi</code> to create your own.</div></div></div>`; }
async function installPack(name){ try{ const r = await api('/api/platform/packs/install', {method:'POST', body:JSON.stringify({name})}); alert(`Installed ${r.name} to ${r.path}`); loadPacks(); }catch(e){ alert(e.message);} }
function manifestsView(){ return `<div class="grid"><div class="card span-12"><div class="h">Tool Manifests</div><table class="tbl"><thead><tr><th>ID</th><th>Provider</th><th>Tools</th><th>Base URL</th><th></th></tr></thead><tbody>${(state.manifests||[]).map(m=>`<tr><td>${esc(m.id)}</td><td>${esc(m.provider||'-')}</td><td>${esc(m.tools_count)}</td><td>${esc(m.base_url||'-')}</td><td><button class="btn" onclick="viewManifest('${esc(m.id)}')">View</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No manifests found</td></tr>'}</tbody></table></div><div class="card span-12 hidden" id="manifest-detail"></div></div>`; }
async function viewManifest(id){ const m = await api('/api/platform/manifests/'+encodeURIComponent(id)); const el=document.getElementById('manifest-detail'); el.classList.remove('hidden'); el.innerHTML = `<div class="h">Manifest: ${esc(id)}</div><pre>${esc(JSON.stringify(m, null, 2))}</pre>`; }
function templatesView(){ const tpls = state.templates||[]; const packs=[...new Set(tpls.map(t=>t.pack))]; const filtered = state.selectedPack ? tpls.filter(t=>t.pack===state.selectedPack) : tpls; const sel = filtered.find(t=>t.id===state.selectedTemplate) || filtered[0] || null; const sampleVars = sel && sel.sample_vars ? JSON.stringify(sel.sample_vars,null,2) : '{\n  "approved": false\n}'; return `<div class="grid"><div class="card span-4"><div class="h">Template Catalog</div><div class="tiny">Built-in templates from packs (generated ACL visible after run).</div><label class="tiny">Pack</label><select onchange="state.selectedPack=this.value; state.selectedTemplate=''; render()">${packs.map(p=>`<option value="${esc(p)}" ${state.selectedPack===p?'selected':''}>${esc(p)}</option>`).join('')}</select><div class="list" style="margin-top:8px">${filtered.map(t=>`<div class="item" style="cursor:pointer;border-color:${state.selectedTemplate===t.id?'#3b82f6':'var(--line)'}" onclick="state.selectedTemplate='${esc(t.id)}';render()"><div><strong>${esc(t.name)}</strong></div><div class="tiny">${esc(t.description||'')}</div><div class="tiny"><code>${esc(t.file)}</code></div></div>`).join('') || '<div class="muted">No templates</div>'}</div></div><div class="card span-8">${sel ? `<div class="h">Run Template: ${esc(sel.name)}</div><div class="split"><div><div class="tiny">Variables JSON</div><textarea id="tpl-vars">${esc(sampleVars)}</textarea><div class="btns" style="margin-top:8px"><button class="btn" onclick="runTemplate('${esc(sel.pack)}','${esc(sel.file)}','preview')">Preview</button><button class="btn primary" onclick="runTemplate('${esc(sel.pack)}','${esc(sel.file)}','run')">Run</button></div><div class="tiny" style="margin-top:8px">Tip: for preview/confirm templates, set <code>approved=false</code> first.</div></div><div><div class="tiny">Template ACL</div><pre class="codebox">${esc(sel.source_acl||'')}</pre></div></div><div id="tpl-run-result" style="margin-top:10px"></div>` : '<div class="muted">Select a template</div>'}</div></div>`; }
async function runTemplate(pack,file,mode){ const box=document.getElementById('tpl-run-result'); box.innerHTML='<div class="tiny">Running...</div>'; try{ let vars={}; try{ vars=JSON.parse(document.getElementById('tpl-vars').value||'{}'); } catch(e){ throw new Error('Invalid vars JSON: '+e.message);} const ep = mode==='preview' ? '/api/platform/templates/preview' : '/api/platform/templates/run'; const data = await api(ep, {method:'POST', body:JSON.stringify({pack, file, vars})}); state.lastRun = data; if(mode==='preview') loadApprovals(); let html=''; if(data.preview_id){ html += `<div class="item"><strong>Preview queued for approval</strong><div class="tiny">approval_id=${esc(data.preview_id)}</div></div>`; }
 if(data.receipt){ html += `<div class="item"><div>${statusPill(data.receipt.status)}</div><pre>${esc(JSON.stringify(data.receipt, null, 2))}</pre></div>`; }
 if(data.generated_acl){ html += `<div class="item"><div class="tiny">Generated/loaded ACL</div><pre>${esc(data.generated_acl)}</pre></div>`; }
 box.innerHTML = html || '<div class="tiny">No response</div>'; if(data.run_id) loadRun(data.run_id); loadRuns(); loadOverview(); } catch(e){ box.innerHTML = `<div class="item" style="border-color:#7f1d1d;color:#fecaca">${esc(e.message)}</div>`; }}
function runsView(){ return `<div class="grid"><div class="card span-6"><div class="h">Recent Runs</div><table class="tbl"><thead><tr><th>ID</th><th>Status</th><th>Intent</th><th>When</th><th></th></tr></thead><tbody>${(state.runs||[]).map(r=>`<tr><td>${r.id}</td><td>${statusPill(r.status)}</td><td>${esc(r.intent||'')}</td><td>${esc(r.timestamp||'')}</td><td><button class="btn" onclick="loadRun(${r.id}); state.page='runs'; renderNav();">View</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No runs yet</td></tr>'}</tbody></table></div><div class="card span-6"><div class="h">Live Event Stream</div><div class="eventlog">${(state.events||[]).map(ev=>`<div class="eventline">${esc(ev.type)} · ${esc(ev.data?.agent||'')} ${ev.data?.step?('· '+esc(ev.data.step)) : ''}</div>`).join('') || '<span class="muted">No events</span>'}</div></div><div class="card span-12">${state.runDetail ? renderRunDetail(state.runDetail) : '<div class="tiny">Select a run to inspect receipt details.</div>'}</div></div>`; }
function renderRunDetail(r){ const rec = r.receipt || r; const steps = (rec.agents||[]).flatMap(a=>a.steps||[]); return `<div class="h">Run #${esc(r.id||'')} Receipt</div><div>${statusPill(rec.status)}</div><div class="kv" style="margin-top:8px"><div class="k">Intent</div><div>${esc(rec.intent||'')}</div><div class="k">Timestamp</div><div>${esc(rec.timestamp||'')}</div><div class="k">Steps</div><div>${steps.length}</div></div><div class="split" style="margin-top:10px"><div><div class="tiny">Step summary</div><table class="tbl"><thead><tr><th>Step</th><th>Tool</th><th>Dur</th><th>Status</th></tr></thead><tbody>${steps.map(s=>`<tr><td><code>${esc(s.name)}</code></td><td><code>${esc(s.target||'')}</code></td><td>${fmtMs(s.duration_ms)}</td><td>${s.error?'<span class="status failed">FAILED</span>':'<span class="status success">OK</span>'}</td></tr>`).join('')}</tbody></table></div><div><div class="tiny">Full receipt JSON</div><pre>${esc(JSON.stringify(rec, null, 2))}</pre></div></div>`; }
function approvalsView(){ return `<div class="grid"><div class="card span-12"><div class="h">Approvals Queue</div><div class="tiny">Preview/confirm UI convention for safer writes. Preview run produces a receipt; approve reruns with <code>approved=true</code>.</div><table class="tbl" style="margin-top:8px"><thead><tr><th>ID</th><th>Template</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${(state.approvals||[]).map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.pack)} / <code>${esc(a.file)}</code></td><td>${statusPill(a.status)}</td><td>${esc(a.created_at||'')}</td><td>${a.status==='pending'?`<div class='btns'><button class='btn primary' onclick='approveReq(${JSON.stringify(a.id)})'>Approve</button><button class='btn warn' onclick='rejectReq(${JSON.stringify(a.id)})'>Reject</button></div>`:'-'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No approval requests</td></tr>'}</tbody></table></div></div>`; }
async function approveReq(id){ try{ await api('/api/platform/approvals/'+encodeURIComponent(id)+'/approve',{method:'POST'}); loadApprovals(); loadRuns(); loadOverview(); }catch(e){ alert(e.message);} }
async function rejectReq(id){ try{ await api('/api/platform/approvals/'+encodeURIComponent(id)+'/reject',{method:'POST'}); loadApprovals(); loadOverview(); }catch(e){ alert(e.message);} }
function credentialsView(){ return `<div class="grid"><div class="card span-6"><div class="h">Stored Credentials (BYO keys/tokens)</div><table class="tbl"><thead><tr><th>Name</th><th>Provider</th><th>Updated</th><th></th></tr></thead><tbody>${(state.creds||[]).map(c=>`<tr><td><code>${esc(c.name)}</code></td><td>${esc(c.provider||'-')}</td><td>${esc(c.updated_at||'')}</td><td><button class="btn warn" onclick="delCred('${esc(c.name)}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No credentials stored</td></tr>'}</tbody></table></div><div class="card span-6"><div class="h">Add / Update Credential</div><div class="row"><div><label class="tiny">Name</label><input id="cred-name" placeholder="EXTRACTLY_API_KEY"></div><div><label class="tiny">Provider</label><input id="cred-provider" placeholder="extractly"></div></div><div style="margin-top:8px"><label class="tiny">Secret value</label><input id="cred-value" type="password" placeholder="paste token"></div><div class="btns" style="margin-top:8px"><button class="btn primary" onclick="saveCred()">Save Credential</button></div><div class="tiny">Values are masked in the UI. This MVP stores them locally for the ACL Platform deployment.</div></div></div>`; }
async function saveCred(){ try{ await api('/api/platform/credentials',{method:'POST', body:JSON.stringify({name:document.getElementById('cred-name').value, provider:document.getElementById('cred-provider').value, value:document.getElementById('cred-value').value})}); document.getElementById('cred-value').value=''; loadCreds(); loadOverview(); }catch(e){ alert(e.message);} }
async function delCred(name){ if(!confirm('Delete credential '+name+'?')) return; try{ await api('/api/platform/credentials/'+encodeURIComponent(name),{method:'DELETE'}); loadCreds(); loadOverview(); }catch(e){ alert(e.message);} }
function render(){ const v=document.getElementById('view'); try{ switch(state.page){ case 'overview': v.innerHTML=overviewView(); break; case 'integrations': v.innerHTML=integrationsView(); break; case 'manifests': v.innerHTML=manifestsView(); break; case 'templates': v.innerHTML=templatesView(); break; case 'runs': v.innerHTML=runsView(); break; case 'approvals': v.innerHTML=approvalsView(); break; case 'credentials': v.innerHTML=credentialsView(); break; default: v.innerHTML=''; } } catch(e){ v.innerHTML = `<div class='card'><pre>${esc(e.stack||e.message)}</pre></div>`; }}
window.setACLToken = (t)=>{ localStorage.setItem('acl_platform_token', t||''); connectStream(); loadOverview(); loadTemplates(); };
renderNav(); render(); connectStream(); loadOverview(); loadTemplates();
</script>
</body>
</html>
